classname: RawEventGenerator
path: proto_nd_flow.reco.charge.raw_event_generator
dset_name: 'charge/raw_events'
params:
  # secondary output
  packets_dset_name: 'charge/packets'

  # configuration parameters
  mc_tracks_dset_name: 'mc_truth/segments'
  buffer_size: 100000
  nhit_cut: 5
  sync_noise_cut: [100, 11000000]
  sync_noise_cut_enabled: False
  event_builder_class: 'SymmetricWindowRawEventBuilder'
  event_builder_config:
    window: 5000 # 0.1 usec ticks
    threshold: 10
  pps_delay_extractor_enabled: True
  pps_delay_extractor_config:
    debug_mode: True
