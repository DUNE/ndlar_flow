# Generates the mid-level event built data for charge data (i.e. hits and
# external triggers)

flow:
  source: raw_events
  stages: [calib_noise_filter]
  drop: []


resources:
  - !include yamls/fsd_flow/resources/RunDataData.yaml
  - !include yamls/fsd_flow/resources/LArData.yaml
  - !include yamls/fsd_flow/resources/GeometryData.yaml

raw_events:
  classname: H5FlowDatasetLoopGenerator
  path: h5flow.modules
  dset_name: 'charge/raw_events'
  params:
    chunk_size: 1

calib_noise_filter:
  !include yamls/fsd_flow/reco/charge/CalibNoiseFilter.yaml

