classname: RawEventGenerator
path: proto_nd_flow.reco.charge.raw_event_generator
dset_name: 'charge/raw_events'
params:
  # secondary output
  packets_dset_name: 'charge/packets'

  # configuration parameters
  mc_tracks_dset_name: 'mc_truth/segments'
  clusters_dset_name: 'charge/clusters'
  buffer_size: 384000
  nhit_cut: 1
  skip_mc_truth: True
  sync_noise_cut: [100, 11000000] 
  sync_noise_cut_enabled: True
  event_builder_class: 'LowEnergyRawEventBuilder' #'SymmetricWindowRawEventBuilder'
  event_builder_config:
    upper_window: 3500 # ExtTrigRawEventBuilder - 2000, more than one drift for 500V/cm
    lower_window: -500
    trig_io_grp: 4
    clusters_eps: 2
    clusters_min_samples: 1
    nhit_limit: 50
