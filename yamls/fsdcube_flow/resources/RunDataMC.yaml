classname: RunData
path: proto_nd_flow.resources.run_data
params:
  path: 'run_info'
  runlist_file: 'data/fsdcube_flow/runlist.fsdcube.txt'
  defaults:
    charge_filename: '-'
    light_filename: '-'
    # FIXME: Is this e_field applied in larnd-sim?
    e_field: 0.0262 # kV/mm
    light_samples: 256
    charge_thresholds: 'medm'
    is_mc: True
    crs_ticks: 0.1 # us
    lrs_ticks: 0.016 # us
    data_packet_type: 1
