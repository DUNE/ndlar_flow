classname: CalibHitBuilder # reco/charge/calib_hit_builder.py
path: proto_nd_flow.reco.charge.calib_prompt_hits
requires:
  - 'charge/events'
  - 'charge/raw_hits'
  - 'charge/packets'
  - 'combined/t0'
  - name: 'charge/packets_index'
    path: ['charge/packets']
    index_only: True

params:
  # inputs
  events_dset_name: 'charge/events'
  packets_dset_name: 'charge/packets'
  packets_index_name: 'charge/packets_index'
  raw_hits_dset_name: 'charge/raw_hits'
  t0_dset_name: 'combined/t0'

  # output
  calib_hits_dset_name: 'charge/calib_prompt_hits'

  # configuration parameters
  vref_mv: 1750
  vcm_mv: 0
  adc_counts: 1023
  gain: 3.4

  #flag to perform electron liftime calibration
  elifetime_calibration: True

  pedestal_file: '/global/cfs/cdirs/dune/www/data/LBL/v3/FSDCube/Feb2026/cold_processed/pedestal_prc-1280_rolling-2026_02_26_16_18_05_PST.flow.json'
