classname: RawEventGenerator
path: proto_nd_flow.reco.charge.raw_event_generator
dset_name: 'charge/raw_events'
params:
  # secondary output
  packets_dset_name: 'charge/packets'

  # configuration parameters
  mc_tracks_dset_name: 'mc_truth/segments'
  buffer_size: 100000
  nhit_cut: 5
  sync_noise_cut: [100, 11000000] # Stephen says no need to cut > first 10 usec
  sync_noise_cut_enabled: False
  event_builder_class: 'ExtTrigRawEventBuilder' #'SymmetricWindowRawEventBuilder'
  event_builder_config:
    window: 5500 # 0.1 usec ticks
    trig_io_grp: 1
    extendable: True
    build_off_beam_events : True
    shifted_event_dt : -5
