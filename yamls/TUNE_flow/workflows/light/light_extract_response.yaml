# Performs noise subtraction, deconvolution, and peak finding on raw light
# waveforms

flow:
  source: 'light/events'
  stages: [timestamp_corrector, wvfm_filt, wvfm_deconv,]

  # remove waveforms from output file
  drop: ['light/wvfm'] #, 'light/fwvfm', 'light/deconv']


resources:
  - !include yamls/fsd_flow/resources/RunDataData.yaml
  - !include yamls/fsd_flow/resources/GeometryData.yaml
  - !include yamls/fsd_flow/resources/LArData.yaml


timestamp_corrector:
  !include yamls/fsd_flow/reco/light/LightTimestampCorrector.yaml


wvfm_filt:
  !include yamls/fsd_flow/reco/light/WaveformNoiseFilter.yaml


wvfm_deconv:
  !include yamls/fsd_flow/reco/light/WaveformDeconvolution_create_files.yaml



