# Performs noise subtraction, deconvolution, and peak finding on raw light
# waveforms

flow:
  source: 'light/events'
  stages: [timestamp_corrector,wvfm_filt, wvfm_align,  wvfm_calib, wvfm_sum, sipm_hit_finder, sum_hit_finder, flash_finder]

  # remove waveforms from output file
  drop: ['light/fwvfm', 'light/deconv', 'light/swvfm', 'light/cwvfm']


resources:
  - !include yamls/proto_nd_flow/resources/RunDataMC.yaml
  - !include yamls/proto_nd_flow/resources/GeometryMC.yaml
  - !include yamls/proto_nd_flow/resources/LArData.yaml


timestamp_corrector:
  !include yamls/proto_nd_flow/reco/light/LightTimestampCorrector.yaml


wvfm_filt:
  !include yamls/proto_nd_flow/reco/light/WaveformNoiseFilter_alternate.yaml


wvfm_deconv:
  !include yamls/proto_nd_flow/reco/light/WaveformDeconvolution.yaml


wvfm_align:
  !include yamls/proto_nd_flow/reco/light/WaveformAlign_alternate.yaml

wvfm_calib:
  !include yamls/proto_nd_flow/reco/light/WaveformCalib_alternate.yaml

wvfm_sum:
  !include yamls/proto_nd_flow/reco/light/WaveformSum_alternate.yaml
  
  
sipm_hit_finder:
  !include yamls/proto_nd_flow/reco/light/SiPMHitFinder_alternate.yaml


sum_hit_finder:
  !include yamls/proto_nd_flow/reco/light/SumHitFinder_alternate.yaml

flash_finder:
  !include yamls/proto_nd_flow/reco/light/FlashFinder_alternate.yaml

