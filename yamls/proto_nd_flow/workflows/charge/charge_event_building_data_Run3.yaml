# Generates the low-level event built data for charge data (i.e. grouped
# packets), 2x2 Run 3 beam trigger settings

flow:
  source: raw_event_generator
  stages: [] # just generate events, no analysis stages
  drop: []


resources:
  - !include yamls/proto_nd_flow/resources/RunDataData.yaml
  - !include yamls/proto_nd_flow/resources/GeometryData.yaml # disabled channels for the nhit cut


raw_event_generator: # groups time-sorted data packets from larpix datalog files
  !include yamls/proto_nd_flow/reco/charge/RawEventGeneratorData_Run3.yaml
