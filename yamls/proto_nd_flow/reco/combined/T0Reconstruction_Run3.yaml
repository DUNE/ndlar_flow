classname: T0Reconstruction
path: proto_nd_flow.reco.combined.t0_reco
requires:
  - 'charge/ext_trigs'
  - 'charge/raw_hits'
params:
  # input
  ext_trigs_dset_name: 'charge/ext_trigs'
  raw_hits_dset_name: 'charge/raw_hits'

  # 2x2 Run 3: the beam charge starts ~220 us after the $74 trigger, so T0 = trigger + 2200 - 2 ticks.
  ext_trig_t0_offset: {3: 2200, 5: 70}

  # output
  t0_dset_name: 'combined/t0'
