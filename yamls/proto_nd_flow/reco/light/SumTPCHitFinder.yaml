classname: WaveformHitFinder # light/hit_finder.py
path: proto_nd_flow.reco.light.hit_finder
requires:
  - 'light/stpc_wvfm'
  - 'light/stpc_wvfm/alignment'
  - 'light/t_ns'
params:
  # inputs
  wvfm_dset_name: 'light/stpc_wvfm'
  t_ns_dset_name: 'light/t_ns'

  # output
  hits_dset_name: 'light/sum_tpc_hits' # new dataset to produce

  # configuration parameters
  near_samples: 4
  hit_level: 'sum_tpc'

  #threshold: !include yamls/proto_nd_flow/reco/light/sipm_threshold.yaml
  # threshold: 
  threshold: 4
