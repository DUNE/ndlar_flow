classname: WaveformHitFinder # light/hit_finder.py
path: proto_nd_flow.reco.light.hit_finder
requires:
  - 'light/stpc_wvfm'
  - 'light/stpc_wvfm_rms'
  - 'light/stpc_wvfm/alignment'
  - 'light/t_ns'
params:
  # inputs
  wvfm_dset_name: 'light/stpc_wvfm'
  rms_dset_name: 'light/stpc_wvfm_rms'
  t_ns_dset_name: 'light/t_ns'

  # output
  hits_dset_name: 'light/sum_tpc_hits' # new dataset to produce

  # threshold:
  threshold: 4

  # configuration parameters
  near_samples: 4
  hit_level: 'sum_tpc'
  noise_factor: 5.0
  n_bins_rolled: 5
  rt_sqrt_factor: 5.0
  pe_weight: 1.0
  rising_edge: False
  prompt_window: 200.0
  long_window: 3200.0
  tick_duration: 16.0